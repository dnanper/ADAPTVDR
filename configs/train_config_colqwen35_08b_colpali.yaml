# Training Configuration — ColQwen3.5-0.8B on ViDoRe colpali_train_set
# Hardware: NVIDIA A100-SXM4-80GB (single GPU)
# Strategy: LoRA on ColQwen3.5-0.8B with teacher-attention alignment enabled

model:
  name_or_path: "/data2/cmdir/home/test01/longvnu/stable_diff/models/Qwen/Qwen3.5-0.8B"
  mode: "multivec_mrl"
  hidden_size: 1024
  torch_dtype: "bfloat16"

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "in_proj_a"
    - "in_proj_b"
    - "in_proj_qkv"
    - "in_proj_z"
    - "out_proj"
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "checkpoints/colqwen3_5_lora-0.8b/ColQwen3.5-0.8B-Embedding-ColPali"
  num_epochs: 1
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  warmup_ratio: 0.025
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  gradient_checkpointing: true
  bf16: true
  fp16: false
  optimizer: "paged_adamw_8bit"
  dataloader_num_workers: 4
  logging_steps: 50
  save_steps: 1000
  save_total_limit: 3
  seed: 42

data:
  train_data_path: "dataset/vidore_train/datasets--vidore--colpali_train_set/snapshots/e13d3594064836f7fd69fad7e3d2b51065b335c7/data"
  eval_data_path: "dataset/vidore_train/datasets--vidore--colpali_train_set/snapshots/e13d3594064836f7fd69fad7e3d2b51065b335c7/data"
  eval_split: "test"
  eval_img_batch: 4
  eval_q_batch: 16
  num_shards: null
  query_instruction: "Represent the user's input."
  doc_instruction: "Represent the user's input."
  attn_cache_path_prior: "dataset/attn_cache_prior_qwen08"
  attn_cache_path_query: "dataset/attn_cache_query_qwen08"
  max_length: 2048
  min_pixels: 4096
  max_pixels: 1048576

loss:
  temperature: 1.0
  dims: [128, 256, 512, 1024]
  weights: [1.0, 1.0, 1.0, 1.0]
  agree_lambda_prior: 0.1
  agree_lambda_query: 0.1
  agree_loss_type: "kl"
  agree_student_score_mode: "softmax_sum"

evaluation:
  eval_steps: 1000
  metrics:
    - "ndcg@5"
    - "recall@1"
    - "recall@5"

pruning:
  k_min: 0.3
  k_max: 0.9
