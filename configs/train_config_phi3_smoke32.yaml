# Fast Phi3/MMDocIR smoke config. Use this only to validate data -> teacher -> train wiring.
model:
  name_or_path: "microsoft/Phi-3-vision-128k-instruct"
  mode: "multivec_mrl"
  projection_dim: 128
  torch_dtype: "bfloat16"

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "checkpoints/colphi3_smoke32"
  num_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-5
  warmup_ratio: 0.0
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  gradient_checkpointing: true
  bf16: true
  fp16: false
  optimizer: "paged_adamw_8bit"
  dataloader_num_workers: 0
  logging_steps: 1
  save_steps: 16
  save_total_limit: 2
  seed: 42

data:
  dataset_type: "mmdocir_triplet"
  train_data_path: "dataset/mmdocir-triplets-k1-smoke32"
  hard_neg_k: 1
  max_length: 2048
  image_size: null
  min_pixels: 4096
  max_pixels: 1048576
  query_instruction: "Represent the user's input."
  doc_instruction: "Represent the user's input."
  attn_cache_path_prior: "dataset/attn_cache_mmdocir_phi3_prior_smoke32"
  attn_cache_path_query: "dataset/attn_cache_mmdocir_phi3_query_smoke32"

loss:
  temperature: 1.0
  use_matryoshka: true
  dims: [32, 64, 128]
  # Phi3 prior alignment requires output_attentions=True on the document pass,
  # which OOMs on 24-32GB GPUs at this smoke resolution.
  agree_lambda_prior: 0.0
  agree_lambda_query: 0.1
  agree_loss_type: "kl"
  agree_student_score_mode: "softmax_sum"
  allow_1d_teacher_resize: false

pruning:
  k_min: 0.3
  k_max: 0.9
  mode: "linear"
