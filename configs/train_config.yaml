# Training Configuration for ColQwen3.5-2B-Base
# Hardware: NVIDIA A100-SXM4-80GB (single GPU)
# Strategy: LoRA on ALL linear layers (attention + MLP), bfloat16, 1 epoch

model:
  name_or_path: "/data2/cmdir/home/test01/longvnu/stable_diff/models/Qwen/Qwen3.5-2B-Base"
  mode: "multivec_mrl"           # dense | multivec_proj | multivec_mrl
  hidden_size: 2048              # Qwen3.5-2B hidden dim (no ColBERT projection for now)
  torch_dtype: "bfloat16"       # A100 prefers bf16 over fp16

lora:
  r: 32
  lora_alpha: 32             # α = r → effective scale = 1
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    # ── Gated DeltaNet layers (75% of 24 layers) ──────────────────────────
    - "in_proj_a"            # Q-like projection for deltanet
    - "in_proj_b"            # K/beta projection for deltanet
    - "in_proj_qkv"          # fused QKV projection
    - "in_proj_z"            # gate projection
    - "out_proj"             # output projection (shared name with GQA)
    # ── Gated Attention / GQA layers (25% of 24 layers) ──────────────────
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    # ── MLP layers (all 24 layers) ────────────────────────────────────────
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "checkpoints/colqwen3_5_lora-2b"
  num_epochs: 1
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  warmup_ratio: 0.025
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  gradient_checkpointing: true
  bf16: true
  fp16: false
  optimizer: "paged_adamw_8bit"
  dataloader_num_workers: 4
  logging_steps: 50
  save_steps: 500
  save_total_limit: 2
  seed: 42

data:
  train_data_path: "dataset/vidore_train/datasets--vidore--colpali_train_set/snapshots/e13d3594064836f7fd69fad7e3d2b51065b335c7/data"
  eval_data_path: "dataset/vidore_train/datasets--vidore--colpali_train_set/snapshots/e13d3594064836f7fd69fad7e3d2b51065b335c7/data"
  eval_split: "test"                   # uses test-00000-of-00001.parquet (500 rows)
  eval_img_batch: 4                    # batch size for encoding documents
  eval_q_batch: 16                     # batch size for encoding queries
  num_shards: null                     # null = load all 82 shards (~118K pairs) of colpali-train-set
  attn_cache_path_prior: null          # image_only teacher attention cache
  attn_cache_path_query: null          # query_image teacher attention cache
  max_length: 2048
  min_pixels: 4096                     # = 4 × 32 × 32
  max_pixels: 1048576                  # = 1024 × 32 × 32

loss:
  # type is informational — loss is now determined by model.mode (multivec_mrl → MatryoshkaMaxSimLoss)
  temperature: 1.0
  dims: [128, 256, 512, 1024, 2048]
  agree_lambda_prior: 0.0
  agree_lambda_query: 0.0
  agree_loss_type: "kl"
  agree_student_score_mode: "softmax_sum"

evaluation:
  eval_steps: 500
  metrics:
    - "ndcg@5"
    - "recall@1"
    - "recall@5"

pruning:
  k_min: 0.3
  k_max: 0.9
