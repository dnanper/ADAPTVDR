# Training Configuration — ColPali-3B (PaliGemma backbone, no compression)
# Uses MatryoshkaMaxSimLoss at dims [256, 512, 1024, 2048] — no hard negatives
# Data: vidore/colpali_train_set (in-batch contrastive, ~118k samples)
#
# Hardware: NVIDIA A100-SXM4-80GB (single GPU)
# NOTE: PaliGemma-3B is larger; use batch_size=4 + grad_accum=8 = eff. batch 32

model:
  name_or_path: "/data2/cmdir/home/test01/longvnu/stable_diff/models/google/paligemma-3b-mix-448"
  torch_dtype: "bfloat16"

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:         # Gemma-2B language model layers
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "checkpoints/colpali_vidore_mrl-3b"
  num_epochs: 1
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4    # eff. batch = 4 * 8 = 32
  learning_rate: 5.0e-5
  warmup_ratio: 0.025
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  gradient_checkpointing: true
  bf16: true
  fp16: false
  optimizer: "paged_adamw_8bit"
  dataloader_num_workers: 4
  logging_steps: 100
  save_steps: 1000
  save_total_limit: 3
  seed: 42
  max_query_len: 50

data:
  train_data_path: "dataset/vidore_train/datasets--vidore--colpali_train_set/snapshots/e13d3594064836f7fd69fad7e3d2b51065b335c7/data"
  eval_data_path:  "dataset/vidore_train/datasets--vidore--colpali_train_set/snapshots/e13d3594064836f7fd69fad7e3d2b51065b335c7/data"
  eval_split: "test"
  eval_img_batch: 4
  eval_q_batch: 16
  num_shards: null
  attn_cache_path_prior: "dataset/attn_cache_prior_qwen08"
  attn_cache_path_query: "dataset/attn_cache_query_qwen08"

loss:
  temperature: 1.0
  dims: [128, 256, 512, 1024, 2048]   # PaliGemma hidden_size=2048; MRL truncation dims
  agree_lambda_prior: 0.1
  agree_lambda_query: 0.1
  agree_loss_type: "kl"
  agree_student_score_mode: "softmax_sum"
